      <div style={{ position: 'relative', flexShrink: 0 }}>
        <Avatar name={conv.name} size={44} />
        {unread && (
          <span style={{
            position: 'absolute', top: -2, right: -2,
            minWidth: 18, height: 18, padding: '0 4px',
            background: 'var(--primary)', color: '#fff',
            borderRadius: 999, fontSize: 10, fontWeight: 700,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            border: '2px solid #fff', lineHeight: 1,
          }}>{conv.unread}</span>
        )}
      </div>

      {/* Text */}
      <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', gap: 3 }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
          <span style={{
            fontSize: 13.5, fontWeight: unread || active ? 700 : 600,
            overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', flex: 1,
          }}>{conv.name}</span>
          <span style={{
            fontSize: 11, flexShrink: 0,
            color: unread ? 'var(--primary)' : 'var(--text-tertiary)',
            fontWeight: unread ? 600 : 400,
          }}>{conv.time}</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
          <StripedThumb category={conv.itemCat} style={{ width: 16, height: 16, borderRadius: 3, flexShrink: 0 }} />
          <span style={{
            fontSize: 11.5, color: 'var(--text-secondary)',
            overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
          }}>{conv.item}</span>
        </div>
        <span style={{
          fontSize: 12.5,
          color: unread ? 'var(--text)' : 'var(--text-secondary)',
          fontWeight: unread ? 500 : 400,
          overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
        }}>{conv.lastMsg}</span>
      </div>

      {divider && (
        <div style={{
          position: 'absolute', left: 72, right: 16, bottom: 0,
          height: 1, background: 'var(--border)',
        }} />
      )}
    </button>
  );
};

/* ─── Thread pane (right) ─────────────────────────────────── */
const ThreadPane = ({ conv, onBack, mobileActive }) => {
  const [draft, setDraft] = useState('');
  const [messages, setMessages] = useState(() => THREADS[conv.id] || []);
  const scrollRef = useRef();

  useEffect(() => {
    setMessages(THREADS[conv.id] || []);
  }, [conv.id]);

  useEffect(() => {
    if (scrollRef.current) {
      scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
    }
  }, [messages, conv.id]);

  const handleSend = () => {
    if (!draft.trim()) return;
    const now = new Date();
    const h = now.getHours() % 12 || 12;
    const m = String(now.getMinutes()).padStart(2, '0');
    const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
    setMessages(prev => [...prev, {
      role: 'me', text: draft.trim(),
      time: `${h}:${m} ${ampm}`, day: 'Today',
    }]);
    setDraft('');
  };

  /* Build display groups */
  const groups = useMemo(() => {
    const out = [];
    let lastDay = null, lastRole = null;
    messages.forEach((m, i) => {
      if (m.day !== lastDay) {
        out.push({ type: 'sep', label: m.day, key: `d${i}` });
        lastDay = m.day; lastRole = null;
      }
      out.push({ ...m, type: 'msg', grouped: lastRole === m.role, key: `m${i}` });
      lastRole = m.role;
    });
    return out;
  }, [messages]);

  return (
    <section className={`chat-thread${mobileActive ? ' show' : ''}`} style={{
      display: 'flex', flexDirection: 'column', minHeight: 0,
      background: '#fff',
    }}>
      {/* Thread header */}
      <header style={{
        height: 64, padding: '0 16px',
        borderBottom: '1px solid var(--border)',
        display: 'flex', alignItems: 'center', gap: 10,
        flexShrink: 0,
      }}>
        <button className="mobile-back" onClick={onBack} aria-label="Back"
          style={{
            width: 32, height: 32, borderRadius: '50%', background: 'transparent',
            border: 'none', cursor: 'pointer', alignItems: 'center', justifyContent: 'center',
            color: 'var(--text)', marginRight: 2, flexShrink: 0,
          }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M19 12H5M5 12l7-7M5 12l7 7" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
          </svg>
        </button>
        <Avatar name={conv.name} size={38} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 14.5, fontWeight: 700, letterSpacing: -0.1 }}>{conv.name}</div>
          <div style={{ fontSize: 12, color: 'var(--text-secondary)', display: 'flex', alignItems: 'center', gap: 5, marginTop: 1 }}>
            <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--success)', display: 'inline-block', flexShrink: 0 }} />
            Active now
          </div>
        </div>
        <IconBtn ariaLabel="Call">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M5 4h4l2 5-3 2a12 12 0 0 0 5 5l2-3 5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1Z" stroke="currentColor" strokeWidth="2" strokeLinejoin="round" />
          </svg>
        </IconBtn>
        <IconBtn ariaLabel="More options">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="5" cy="12" r="1.5" fill="currentColor" />
            <circle cx="12" cy="12" r="1.5" fill="currentColor" />
            <circle cx="19" cy="12" r="1.5" fill="currentColor" />
          </svg>
        </IconBtn>
      </header>

      {/* Pinned item */}
      <div style={{
        flexShrink: 0, padding: '12px 18px',
        borderBottom: '1px solid var(--border)',
        display: 'flex', gap: 14, alignItems: 'center',
        background: '#fff',
      }}>
        <StripedThumb
          category={conv.itemCat} tag={conv.tag}
          style={{ width: 52, height: 52, borderRadius: 8 }}
        />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{
            fontSize: 13.5, fontWeight: 600,
            overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
          }}>{conv.item}</div>
          <div style={{ fontSize: 18, fontWeight: 800, color: 'var(--primary)', letterSpacing: -0.3, marginTop: 3 }}>
            ฿{conv.price.toLocaleString()}
          </div>
        </div>
        <ViewBtn />
      </div>

      {/* Messages */}
      <div
        ref={scrollRef}
        className="hide-scroll"
        style={{
          flex: 1, overflowY: 'auto', minHeight: 0,
          padding: '12px 28px 16px',
          background: '#fafafa',
          display: 'flex', flexDirection: 'column', gap: 2,
        }}>
        {groups.map(item => {
          if (item.type === 'sep') return (
            <div key={item.key} style={{
              display: 'flex', alignItems: 'center', gap: 10,
              margin: '16px 0 8px',
              fontSize: 11, fontWeight: 600, letterSpacing: 0.5,
              textTransform: 'uppercase', color: 'var(--text-tertiary)',
            }}>
              <div style={{ flex: 1, height: 1, background: 'var(--border)' }} />
              <span>{item.label}</span>
              <div style={{ flex: 1, height: 1, background: 'var(--border)' }} />
            </div>
          );

          const isMine = item.role === 'me';
          return (
            <div key={item.key} style={{
              display: 'flex',
              justifyContent: isMine ? 'flex-end' : 'flex-start',
              marginTop: item.grouped ? 2 : 8,
            }}>
              <div style={{
                maxWidth: '68%', display: 'flex', flexDirection: 'column',
                alignItems: isMine ? 'flex-end' : 'flex-start', gap: 3,
              }}>
                <div style={{
                  background: isMine ? 'var(--primary)' : 'var(--bubble-received)',
                  color: isMine ? '#fff' : 'var(--text)',
                  padding: '10px 14px',
                  borderRadius: 20,
                  borderTopRightRadius: isMine && item.grouped ? 6 : 20,
                  borderTopLeftRadius:  !isMine && item.grouped ? 6 : 20,
                  borderBottomRightRadius: isMine ? 6 : 20,
                  borderBottomLeftRadius:  !isMine ? 6 : 20,
                  fontSize: 14, lineHeight: 1.45, wordBreak: 'break-word',
                }}>{item.text}</div>
                <div style={{
                  display: 'flex', alignItems: 'center', gap: 4,
                  fontSize: 10.5, color: 'var(--text-tertiary)', padding: '0 4px',
                }}>
                  <span>{item.time}</span>
                  {isMine && (
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                      <path d="M2 12.5l4.5 4.5L13 9" stroke="#fa4617" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                      <path d="M9 12.5l4.5 4.5L21 8" stroke="#fa4617" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                    </svg>
                  )}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Composer */}
      <Composer value={draft} onChange={setDraft} onSend={handleSend} />
    </section>
  );
};

const ViewBtn = () => {
  const [hover, setHover] = useState(false);
  return (
    <button
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        background: hover ? 'var(--surface-alt)' : 'transparent',
        border: '1.5px solid var(--border)',
        color: 'var(--text)', borderRadius: 6,
        padding: '7px 12px', fontSize: 13, fontWeight: 600,
        cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 4,
        flexShrink: 0, whiteSpace: 'nowrap',
        transition: 'background 120ms ease',
      }}>
      View listing
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
        <path d="M9 6l6 6-6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      </svg>
    </button>
  );
};

const Composer = ({ value, onChange, onSend }) => {
  const [focus, setFocus] = useState(false);
  const canSend = value.trim().length > 0;
  return (
    <div style={{
      flexShrink: 0, background: '#fff',
      borderTop: '1px solid var(--border)',
      padding: '10px 14px',
      display: 'flex', alignItems: 'flex-end', gap: 8,
    }}>
      <IconBtn ariaLabel="Attach file">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M20 12l-7 7a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-8 8a2 2 0 0 1-3-3l7-7" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      </IconBtn>

      <div style={{
        flex: 1, background: '#f1f1f1',
        border: `1.5px solid ${focus ? 'var(--primary)' : 'transparent'}`,
        borderRadius: 22, padding: '8px 14px',
        minHeight: 44, display: 'flex', alignItems: 'center',
        transition: 'all 120ms ease',
        boxShadow: focus ? '0 0 0 3px var(--primary-tint)' : 'none',
      }}>
        <input
          value={value}
          onChange={e => onChange(e.target.value)}
          onFocus={() => setFocus(true)}
          onBlur={() => setFocus(false)}
          onKeyDown={e => { if (e.key === 'Enter' && canSend) onSend(); }}
          placeholder="Type a message…"
          style={{
            flex: 1, border: 'none', outline: 'none',
            background: 'transparent', fontSize: 14,
            color: 'var(--text)', minWidth: 0, fontFamily: 'inherit',
          }}
        />
      </div>

      <button
        onClick={() => canSend && onSend()}
        disabled={!canSend}
        aria-label="Send message"
        style={{
          width: 44, height: 44, borderRadius: '50%',
          background: canSend ? 'var(--primary)' : '#e5e5e5',
          color: canSend ? '#fff' : '#a8a8a8',
          border: 'none', cursor: canSend ? 'pointer' : 'default',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          flexShrink: 0,
          boxShadow: canSend ? '0 2px 6px rgba(250,70,23,0.25)' : 'none',
          transition: 'all 120ms ease',
        }}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path
            d="M4 12l16-8-6 16-2.5-6.5L4 12Z"
            stroke="currentColor" strokeWidth="2" strokeLinejoin="round"
            fill={canSend ? 'currentColor' : 'none'}
          />
        </svg>
      </button>
    </div>
  );
};

/* ─── Empty state ─────────────────────────────────────────── */
const EmptyThread = () => (
  <div style={{
    flex: 1, display: 'flex', flexDirection: 'column',
    alignItems: 'center', justifyContent: 'center',
    padding: '48px 32px', gap: 14, textAlign: 'center',
    background: '#fafafa',
  }}>
    <div style={{
      width: 88, height: 88, borderRadius: '50%',
      background: 'var(--primary-tint)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
          stroke="#fa4617" strokeWidth="1.8" strokeLinejoin="round" fill="rgba(250,70,23,0.08)" />
      </svg>
    </div>
    <div>
      <h2 style={{ fontSize: 17, fontWeight: 700, margin: 0 }}>Select a conversation</h2>
      <p style={{ fontSize: 13.5, color: 'var(--text-secondary)', marginTop: 6, lineHeight: 1.55 }}>
        Pick a chat from the list, or browse the feed to start a new one.
      </p>
    </div>
  </div>
);

/* ─── App ─────────────────────────────────────────────────── */
const App = () => {
  const [activeId, setActiveId] = useState('earth');
  const [mobilePane, setMobilePane] = useState('list');

  const activeConv = CONVERSATIONS.find(c => c.id === activeId);

  const handleSelect = (id) => {
    setActiveId(id);
    setMobilePane('thread');
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100vh', overflow: 'hidden' }}>
      <TopNav />
      <main style={{
        flex: 1, minHeight: 0, overflow: 'hidden',
        padding: '16px 24px',
        display: 'flex',
      }}>
        <div className="chat-grid" style={{
          flex: 1, minHeight: 0,
          display: 'grid',
          gridTemplateColumns: '360px 1fr',
          background: '#fff',
          border: '1px solid var(--border)',
          borderRadius: 12, overflow: 'hidden',
          boxShadow: 'var(--shadow-card)',
        }}>
          <ConvList
            activeId={activeId}
            onSelect={handleSelect}
            mobileActive={mobilePane === 'list'}
          />
          {activeConv
            ? <ThreadPane
                conv={activeConv}
                onBack={() => setMobilePane('list')}
                mobileActive={mobilePane === 'thread'}
              />
            : <EmptyThread />
          }
        </div>
      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
