
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Close Deal — KMUTT·EXG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #fa4617;
      --primary-hover: #d93a13;
      --primary-tint: rgba(250,70,23,0.09);
      --primary-tint-strong: rgba(250,70,23,0.14);
      --bg: #f7f7f7;
      --surface: #ffffff;
      --surface-alt: #f7f7f7;
      --border: #e5e5e5;
      --border-strong: #d4d4d4;
      --text: #1a1a1a;
      --text-secondary: #6b6b6b;
      --text-tertiary: #9a9a9a;
      --success: #10b981;
      --success-dark: #047857;
      --error: #dc2626;
      --shadow-nav: 0 1px 2px rgba(16,24,40,0.04);
      --shadow-card: 0 1px 2px rgba(16,24,40,0.04), 0 4px 12px rgba(16,24,40,0.05);
      --shadow-popover: 0 8px 28px rgba(16,24,40,0.14);
      --shadow-modal: 0 16px 48px rgba(16,24,40,0.18), 0 4px 12px rgba(16,24,40,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      min-height: 100%; overflow-x: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      color: var(--text);
    }
    @keyframes spin     { to { transform: rotate(360deg); } }
    @keyframes scaleIn  { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes toastIn  { from { opacity: 0; transform: translateX(-50%) translateY(12px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .hide-scroll { scrollbar-width: none; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    @media (max-width: 900px) { .search-bar { display: none !important; } }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

const CATEGORY_PALETTE = {
  Books:       { bg: '#fef3ec', stripe: '#fde0cd', label: '#a3580f' },
  Electronics: { bg: '#eef1f7', stripe: '#dbe1ec', label: '#3c4a64' },
  Furniture:   { bg: '#f1efe9', stripe: '#e3dfd2', label: '#6b5d3a' },
  Clothing:    { bg: '#f3eef3', stripe: '#e3d8e3', label: '#6a4a6a' },
  Other:       { bg: '#eef3f0', stripe: '#dbe6df', label: '#3f6253' },
};

const ITEM = {
  title: 'KMUTT engineering hoodie, size L',
  price: 380,
  category: 'Clothing',
  tag: 'KMUTT hoodie',
  condition: 'Like New',
  posted: '3 days ago',
  location: 'North Campus, Dorm A lobby',
  description: 'Worn once for freshman orientation. Washed and clean. Official KMUTT Faculty of Engineering hoodie in good condition, no pilling or fading.',
  seller: { name: 'Pim Suwannarat', rating: 4.9, sales: 12 },
};

const CHAT_BUYERS = [
  { id: 'ploy', name: 'Ploy Nopkasem',   dept: 'Faculty of Engineering · Year 2' },
  { id: 'jay',  name: 'Jay P.',           dept: 'School of IT · Year 3' },
];

const OTHER_STUDENTS = [
  { id: 'nong', name: 'Nong Chaiyanant', dept: 'Faculty of Science · Year 1' },
  { id: 'fon',  name: 'Fon Panyarat',    dept: 'Faculty of Engineering · Year 4' },
  { id: 'tom',  name: 'Tom Wiroj',       dept: 'School of Architecture · Year 2' },
  { id: 'kla',  name: 'Kla Benchamart',  dept: 'Graduate School · Year 1' },
];

const Avatar = ({ name, size = 40 }) => {
  const hue = (name.charCodeAt(0) * 37) % 360;
  const initials = name.split(' ').map(s => s[0]).slice(0, 2).join('').toUpperCase();
  return (
    <div style={{ width: size, height: size, borderRadius: '50%', background: `oklch(0.82 0.04 ${hue})`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: size * 0.36, fontWeight: 700, color: '#1a1a1a', flexShrink: 0, userSelect: 'none' }}>
      {initials}
    </div>
  );
};

const StripedThumb = ({ category, tag, hideLabel, style: s = {} }) => {
  const p = CATEGORY_PALETTE[category] || CATEGORY_PALETTE.Other;
  return (
    <div style={{ background: `repeating-linear-gradient(135deg, ${p.bg} 0 12px, ${p.stripe} 12px 24px)`, display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', flexShrink: 0, ...s }}>
      {tag && !hideLabel && (
        <span style={{ fontFamily: "'JetBrains Mono', ui-monospace, monospace", fontSize: 9.5, color: p.label, background: 'rgba(255,255,255,0.82)', padding: '3px 7px', borderRadius: 3, letterSpacing: 0.2, lineHeight: 1.2, textAlign: 'center' }}>
          [{tag}]
        </span>
      )}
    </div>
  );
};

const NavIconBtn = ({ children, ariaLabel, badge }) => {
  const [h, setH] = useState(false);
  return (
    <div style={{ position: 'relative', flexShrink: 0 }}>
      <button aria-label={ariaLabel} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
        style={{ width: 40, height: 40, borderRadius: '50%', background: h ? '#f1f1f1' : 'transparent', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text)', transition: 'background 120ms ease' }}>
        {children}
      </button>
      {badge && (
        <span style={{ position: 'absolute', top: 5, right: 5, minWidth: 18, height: 18, padding: '0 4px', background: 'var(--primary)', color: '#fff', borderRadius: 999, fontSize: 10, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', border: '2px solid #fff', lineHeight: 1, pointerEvents: 'none' }}>
          {badge}
        </span>
      )}
    </div>
  );
};

const TopNav = () => {
  const [focused, setFocused] = useState(false);
  return (
    <nav style={{ background: 'rgba(255,255,255,0.92)', backdropFilter: 'saturate(180%) blur(10px)', WebkitBackdropFilter: 'saturate(180%) blur(10px)', borderBottom: '1px solid var(--border)', position: 'sticky', top: 0, zIndex: 30 }}>
      <div style={{ maxWidth: 1440, margin: '0 auto', padding: '12px 24px', display: 'flex', alignItems: 'center', gap: 16 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 9, cursor: 'pointer', flexShrink: 0 }}>
          <div style={{ width: 34, height: 34, borderRadius: 9, background: 'var(--primary)', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 2px 6px rgba(250,70,23,0.25)' }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden>
              <path d="M4 8L15 8M12.5 5.5L15 8L12.5 10.5" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
              <path d="M20 16L9 16M11.5 13.5L9 16L11.5 18.5" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </div>
          <span style={{ fontSize: 17, fontWeight: 800, letterSpacing: -0.4, color: 'var(--text)', whiteSpace: 'nowrap' }}>
            sw<span style={{ color: 'var(--primary)' }}>a</span>p
          </span>
        </div>
        <div className="search-bar" style={{ flex: 1, maxWidth: 520, display: 'flex', alignItems: 'center', background: focused ? '#fff' : '#f1f1f1', border: `1.5px solid ${focused ? 'var(--primary)' : 'transparent'}`, borderRadius: 999, padding: '0 14px', height: 42, transition: 'all 120ms ease', boxShadow: focused ? '0 0 0 4px rgba(250,70,23,0.09)' : 'none' }}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style={{ color: 'var(--text-secondary)', flexShrink: 0 }}>
            <circle cx="11" cy="11" r="7" stroke="currentColor" strokeWidth="2"/>
            <path d="M20 20l-3.5-3.5" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
          </svg>
          <input type="text" placeholder="Search items..." onFocus={() => setFocused(true)} onBlur={() => setFocused(false)}
            style={{ flex: 1, border: 'none', outline: 'none', background: 'transparent', fontSize: 14.5, color: 'var(--text)', padding: '0 10px', height: '100%', fontFamily: 'inherit' }} />
        </div>
        <div style={{ flex: 1 }} />
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
          <NavIconBtn ariaLabel="Messages" badge="3">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M21 12a9 9 0 0 1-13.03 8.07L4 21l1.17-3.97A9 9 0 1 1 21 12Z" stroke="currentColor" strokeWidth="2" strokeLinejoin="round"/>
            </svg>
          </NavIconBtn>
          <Avatar name="Pim Suwannarat" size={36} />
          <button style={{ height: 40, padding: '0 18px', borderRadius: 8, background: 'var(--primary)', color: '#fff', border: 'none', cursor: 'pointer', fontSize: 14, fontWeight: 700, letterSpacing: 0.1, fontFamily: 'inherit' }}>Sell</button>
        </div>
      </div>
    </nav>
  );
};

const BackdropContent = () => {
  const p = CATEGORY_PALETTE[ITEM.category];
  return (
    <div style={{ maxWidth: 1200, margin: '0 auto', padding: '24px', display: 'grid', gridTemplateColumns: '1.4fr 1fr', gap: 32 }}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
        <div style={{ aspectRatio: '1 / 1', borderRadius: 12, overflow: 'hidden', border: '1px solid var(--border)', maxHeight: 520 }}>
          <StripedThumb category={ITEM.category} tag={ITEM.tag} hideLabel style={{ width: '100%', height: '100%' }} />
        </div>
        <div style={{ background: '#fff', borderRadius: 10, border: '1px solid var(--border)', padding: '18px 20px' }}>
          <div style={{ height: 14, width: '30%', background: '#ebebeb', borderRadius: 4, marginBottom: 10 }} />
          <div style={{ height: 11, width: '90%', background: '#ebebeb', borderRadius: 4, marginBottom: 8 }} />
          <div style={{ height: 11, width: '75%', background: '#ebebeb', borderRadius: 4 }} />
        </div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        <div style={{ display: 'flex', gap: 8, marginBottom: 2 }}>
          <div style={{ height: 22, width: 80, background: p.bg, borderRadius: 4 }} />
          <div style={{ height: 22, width: 60, background: '#ebebeb', borderRadius: 4 }} />
        </div>
        <div style={{ height: 30, width: '88%', background: '#ebebeb', borderRadius: 5 }} />
        <div style={{ height: 30, width: '55%', background: p.bg, borderRadius: 5 }} />
        <div style={{ height: 44, width: '100%', background: '#ebebeb', borderRadius: 6 }} />
        <div style={{ height: 44, width: '100%', background: p.bg, borderRadius: 6, opacity: 0.7 }} />
        <div style={{ height: 1, background: 'var(--border)', margin: '4px 0' }} />
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ width: 40, height: 40, borderRadius: '50%', background: '#ebebeb' }} />
          <div style={{ flex: 1 }}>
            <div style={{ height: 13, width: '50%', background: '#ebebeb', borderRadius: 4, marginBottom: 6 }} />
            <div style={{ height: 11, width: '40%', background: '#ebebeb', borderRadius: 4 }} />
          </div>
        </div>
      </div>
    </div>
  );
};

const Overlay = ({ onClose }) => (
  <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(15,17,21,0.55)', zIndex: 100, animation: 'overlayIn 160ms ease' }} />
);

const ModalShell = ({ title, subtitle, onClose, children, footer }) => (
  <div onClick={e => e.stopPropagation()} style={{ position: 'fixed', top: '50%', left: '50%', transform: 'translate(-50%, -50%)', zIndex: 101, width: 'min(480px, calc(100vw - 48px))', background: '#fff', borderRadius: 12, boxShadow: 'var(--shadow-modal)', maxHeight: 'calc(100vh - 48px)', display: 'flex', flexDirection: 'column', overflow: 'hidden', animation: 'scaleIn 160ms cubic-bezier(.2,.7,.2,1)' }}>
    <div style={{ padding: '22px 22px 0', display: 'flex', alignItems: 'flex-start', gap: 12 }}>
      <div style={{ flex: 1 }}>
        <h2 style={{ margin: 0, fontSize: 20, fontWeight: 700, letterSpacing: -0.3, lineHeight: 1.3 }}>{title}</h2>
        {subtitle && <p style={{ margin: '5px 0 0', fontSize: 13.5, color: 'var(--text-secondary)', lineHeight: 1.5 }}>{subtitle}</p>}
      </div>
      <button onClick={onClose} aria-label="Close"
        style={{ width: 32, height: 32, borderRadius: 999, background: 'transparent', border: 'none', cursor: 'pointer', color: 'var(--text-secondary)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, marginTop: -2, transition: 'background 120ms ease' }}
        onMouseOver={e => e.currentTarget.style.background = '#f1f1f1'}
        onMouseOut={e => e.currentTarget.style.background = 'transparent'}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
      </button>
    </div>
    <div className="hide-scroll" style={{ flex: 1, overflowY: 'auto', padding: '16px 22px', display: 'flex', flexDirection: 'column', gap: 14 }}>
      {children}
    </div>
    <div style={{ padding: '14px 22px 20px', borderTop: '1px solid var(--border)', background: '#fff' }}>
      {footer}
    </div>
  </div>
);

const Field = ({ label, hint, children }) => (
  <div style={{ display: 'flex', flexDirection: 'column', gap: 7 }}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
      <label style={{ fontSize: 13, fontWeight: 600, color: 'var(--text)' }}>{label}</label>
      {hint && <span style={{ fontSize: 12, color: 'var(--text-tertiary)' }}>{hint}</span>}
    </div>
    {children}
  </div>
);

const ItemPreview = () => (
  <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: 12, background: 'var(--surface-alt)', border: '1px solid var(--border)', borderRadius: 10 }}>
    <StripedThumb category={ITEM.category} tag={ITEM.tag} style={{ width: 52, height: 52, borderRadius: 8 }} />
    <div style={{ flex: 1, minWidth: 0 }}>
      <div style={{ fontSize: 14, fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{ITEM.title}</div>
      <div style={{ fontSize: 12.5, color: 'var(--text-secondary)', marginTop: 2 }}>
        Listed at <span style={{ fontWeight: 600 }}>฿{ITEM.price.toLocaleString()}</span>
      </div>
    </div>
  </div>
);

const PriceInput = ({ value, onChange }) => {
  const [focus, setFocus] = useState(false);
  return (
    <Field label="Final sale price">
      <div style={{ display: 'flex', alignItems: 'center', background: '#fff', border: `1.5px solid ${focus ? 'var(--primary)' : 'var(--border)'}`, borderRadius: 6, padding: '0 12px', height: 46, boxShadow: focus ? '0 0 0 4px var(--primary-tint)' : 'none', transition: 'all 120ms ease' }}>
        <span style={{ color: 'var(--text-secondary)', fontSize: 16, fontWeight: 700, marginRight: 8 }}>฿</span>
        <input value={value} onChange={e => onChange(e.target.value.replace(/[^0-9]/g, ''))}
          onFocus={() => setFocus(true)} onBlur={() => setFocus(false)}
          style={{ flex: 1, border: 'none', outline: 'none', background: 'transparent', fontSize: 17, fontWeight: 700, color: 'var(--text)', minWidth: 0, letterSpacing: -0.3, fontFamily: 'inherit' }} />
      </div>
      <span style={{ fontSize: 12, color: 'var(--text-secondary)' }}>Adjust if you agreed on a different price.</span>
    </Field>
  );
};

const NoteInput = ({ value, onChange }) => {
  const [focus, setFocus] = useState(false);
  return (
    <Field label="Add a note" hint="Only you can see this">
      <textarea value={value} onChange={e => onChange(e.target.value)} placeholder="e.g., met at Engineering B lobby 5pm"
        onFocus={() => setFocus(true)} onBlur={() => setFocus(false)} rows={2}
        style={{ width: '100%', border: `1.5px solid ${focus ? 'var(--primary)' : 'var(--border)'}`, borderRadius: 6, padding: '10px 12px', fontSize: 14, color: 'var(--text)', resize: 'vertical', outline: 'none', background: '#fff', fontFamily: 'inherit', lineHeight: 1.5, boxShadow: focus ? '0 0 0 4px var(--primary-tint)' : 'none', transition: 'all 120ms ease' }} />
    </Field>
  );
};

const PickerSection = ({ title, children, border }) => (
  <div style={{ borderTop: border ? '1px solid var(--border)' : 'none' }}>
    <div style={{ padding: '8px 14px 4px', fontSize: 11, fontWeight: 700, color: 'var(--text-secondary)', letterSpacing: 0.6, textTransform: 'uppercase', background: 'var(--surface-alt)' }}>{title}</div>
    {children}
  </div>
);

const PickerRow = ({ user, chatBadge, onClick }) => {
  const [h, setH] = useState(false);
  return (
    <button onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{ width: '100%', background: h ? 'var(--surface-alt)' : '#fff', border: 'none', textAlign: 'left', padding: '10px 14px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 10, transition: 'background 120ms ease' }}>
      <Avatar name={user.name} size={36} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <span style={{ fontSize: 14, fontWeight: 600 }}>{user.name}</span>
          {chatBadge && (
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 3, fontSize: 10, fontWeight: 600, color: 'var(--primary)', background: 'var(--primary-tint)', padding: '2px 6px', borderRadius: 999, letterSpacing: 0.2 }}>
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none"><path d="M21 12a9 9 0 0 1-13.03 8.07L4 21l1.17-3.97A9 9 0 1 1 21 12Z" stroke="currentColor" strokeWidth="2.5" strokeLinejoin="round"/></svg>
              Chat
            </span>
          )}
        </div>
        <div style={{ fontSize: 12, color: 'var(--text-secondary)', marginTop: 1 }}>{user.dept}</div>
      </div>
    </button>
  );
};

const UserPicker = ({ selected, setSelected }) => {
  const [query, setQuery] = useState('');
  const [focus, setFocus] = useState(false);
  const [open, setOpen] = useState(true);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    const f = xs => q ? xs.filter(u => u.name.toLowerCase().includes(q)) : xs;
    return { chats: f(CHAT_BUYERS), others: f(OTHER_STUDENTS) };
  }, [query]);

  const handleSelect = user => { setSelected(user); setQuery(''); setOpen(false); };

  return (
    <Field label="Buyer">
      {selected ? (
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, background: 'var(--primary-tint)', border: '1.5px solid rgba(250,70,23,0.25)', borderRadius: 8, padding: '8px 10px 8px 8px' }}>
          <Avatar name={selected.name} size={36} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 14, fontWeight: 600 }}>{selected.name}</div>
            <div style={{ fontSize: 12, color: 'var(--text-secondary)', marginTop: 1 }}>{selected.dept}</div>
          </div>
          <button onClick={() => { setSelected(null); setOpen(true); }} aria-label="Change buyer"
            style={{ width: 28, height: 28, borderRadius: '50%', background: 'rgba(255,255,255,0.7)', color: 'var(--text)', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"/></svg>
          </button>
        </div>
      ) : (
        <>
          <div style={{ display: 'flex', alignItems: 'center', background: '#fff', border: `1.5px solid ${focus ? 'var(--primary)' : 'var(--border)'}`, borderRadius: 6, padding: '0 12px', height: 44, boxShadow: focus ? '0 0 0 4px var(--primary-tint)' : 'none', transition: 'all 120ms ease' }}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style={{ color: 'var(--text-secondary)', flexShrink: 0 }}>
              <circle cx="11" cy="11" r="7" stroke="currentColor" strokeWidth="2"/>
              <path d="M20 20l-3.5-3.5" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
            </svg>
            <input value={query} onChange={e => { setQuery(e.target.value); setOpen(true); }}
              onFocus={() => { setFocus(true); setOpen(true); }} onBlur={() => setFocus(false)}
              placeholder="Search by name…"
              style={{ flex: 1, border: 'none', outline: 'none', background: 'transparent', fontSize: 14.5, padding: '0 10px', minWidth: 0, color: 'var(--text)', fontFamily: 'inherit' }} />
          </div>
          {open && (
            <div className="hide-scroll" style={{ background: '#fff', border: '1px solid var(--border)', borderRadius: 10, overflow: 'hidden', maxHeight: 260, overflowY: 'auto', marginTop: 4, boxShadow: 'var(--shadow-popover)' }}>
              {filtered.chats.length > 0 && (
                <PickerSection title="Chatted about this listing">
                  {filtered.chats.map(u => <PickerRow key={u.id} user={u} chatBadge onClick={() => handleSelect(u)} />)}
                </PickerSection>
              )}
              {filtered.others.length > 0 && (
                <PickerSection title="Other KMUTT students" border={filtered.chats.length > 0}>
                  {filtered.others.map(u => <PickerRow key={u.id} user={u} onClick={() => handleSelect(u)} />)}
                </PickerSection>
              )}
              {filtered.chats.length === 0 && filtered.others.length === 0 && (
                <div style={{ padding: 20, textAlign: 'center', fontSize: 13, color: 'var(--text-secondary)' }}>No students match "{query}"</div>
              )}
            </div>
          )}
        </>
      )}
    </Field>
  );
};

const ActionRow = ({ onCancel, onConfirm, disabled, loading }) => {
  const [h, setH] = useState(false);
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10, justifyContent: 'flex-end' }}>
      <button onClick={onCancel}
        style={{ height: 44, padding: '0 16px', borderRadius: 6, background: 'transparent', color: 'var(--text)', border: 'none', cursor: 'pointer', fontSize: 14, fontWeight: 600, fontFamily: 'inherit', transition: 'background 120ms ease' }}
        onMouseOver={e => e.currentTarget.style.background = '#f1f1f1'}
        onMouseOut={e => e.currentTarget.style.background = 'transparent'}>
        Cancel
      </button>
      <button onClick={onConfirm} disabled={disabled || loading}
        onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
        style={{ height: 44, padding: '0 22px', background: disabled ? '#e5e5e5' : (h ? 'var(--primary-hover)' : 'var(--primary)'), color: disabled ? '#a8a8a8' : '#fff', border: 'none', borderRadius: 6, fontSize: 14.5, fontWeight: 600, cursor: disabled ? 'not-allowed' : 'pointer', boxShadow: h && !disabled ? '0 4px 12px rgba(250,70,23,0.3)' : 'none', display: 'flex', alignItems: 'center', gap: 7, transition: 'all 120ms ease', fontFamily: 'inherit' }}>
        {loading
          ? <span style={{ width: 16, height: 16, borderRadius: '50%', border: '2px solid rgba(255,255,255,0.4)', borderTopColor: '#fff', display: 'inline-block', animation: 'spin 700ms linear infinite' }} />
          : <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
        {loading ? 'Confirming…' : 'Confirm Sale'}
      </button>
    </div>
  );
};

const Toast = ({ message }) => (
  <div style={{ position: 'fixed', bottom: 32, left: '50%', transform: 'translateX(-50%)', background: '#1a1a1a', color: '#fff', padding: '12px 18px', borderRadius: 999, fontSize: 14, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 9, boxShadow: '0 8px 24px rgba(0,0,0,0.18)', zIndex: 200, animation: 'toastIn 220ms cubic-bezier(.2,.7,.2,1)', whiteSpace: 'nowrap' }}>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" fill="#10b981"/>
      <path d="M7 12.5l3.5 3.5L17 9" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
    {message}
  </div>
);

const FromChatModal = ({ onClose, onConfirm, onSwitchToPick }) => {
  const buyer = CHAT_BUYERS[0];
  const [price, setPrice] = useState(String(ITEM.price));
  const [note, setNote] = useState('');
  const [loading, setLoading] = useState(false);

  const handleConfirm = () => {
    if (!price.trim()) return;
    setLoading(true);
    setTimeout(() => { setLoading(false); onConfirm({ buyer: buyer.name, price }); }, 1100);
  };

  return (
    <ModalShell title={`Confirm sale to ${buyer.name}?`} subtitle="Review the details below before closing the deal." onClose={onClose}
      footer={<ActionRow onCancel={onClose} onConfirm={handleConfirm} disabled={!price.trim()} loading={loading} />}>
      <ItemPreview />
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', background: 'var(--surface-alt)', border: '1px solid var(--border)', borderRadius: 8 }}>
        <Avatar name={buyer.name} size={36} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 14, fontWeight: 600 }}>{buyer.name}</div>
          <div style={{ fontSize: 12, color: 'var(--text-secondary)', marginTop: 1 }}>{buyer.dept}</div>
        </div>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 3, fontSize: 10.5, fontWeight: 600, color: 'var(--primary)', background: 'var(--primary-tint)', padding: '3px 8px', borderRadius: 999 }}>
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none"><path d="M21 12a9 9 0 0 1-13.03 8.07L4 21l1.17-3.97A9 9 0 1 1 21 12Z" stroke="currentColor" strokeWidth="2.5" strokeLinejoin="round"/></svg>
          Chat
        </span>
      </div>
      <PriceInput value={price} onChange={setPrice} />
      <NoteInput value={note} onChange={setNote} />
      <button onClick={onSwitchToPick}
        style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 13, color: 'var(--text-secondary)', textAlign: 'left', padding: 0, textDecoration: 'underline', textUnderlineOffset: 2, fontFamily: 'inherit' }}>
        Not {buyer.name}? Choose a different buyer
      </button>
    </ModalShell>
  );
};

const PickBuyerModal = ({ onClose, onConfirm }) => {
  const [selected, setSelected] = useState(null);
  const [price, setPrice] = useState(String(ITEM.price));
  const [note, setNote] = useState('');
  const [loading, setLoading] = useState(false);
  const canConfirm = !!selected && !!price.trim();

  const handleConfirm = () => {
    if (!canConfirm) return;
    setLoading(true);
    setTimeout(() => { setLoading(false); onConfirm({ buyer: selected.name, price }); }, 1100);
  };

  return (
    <ModalShell title="Who did you sell this to?" subtitle="Select the buyer to close this listing." onClose={onClose}
      footer={<ActionRow onCancel={onClose} onConfirm={handleConfirm} disabled={!canConfirm} loading={loading} />}>
      <ItemPreview />
      <UserPicker selected={selected} setSelected={setSelected} />
      <PriceInput value={price} onChange={setPrice} />
      <NoteInput value={note} onChange={setNote} />
    </ModalShell>
  );
};

const App = () => {
  const [flavor, setFlavor] = useState('from-chat');
  const [toast, setToast] = useState(null);
  const [done, setDone] = useState(false);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 3000);
    return () => clearTimeout(t);
  }, [toast]);

  const handleConfirm = ({ buyer, price }) => {
    setDone(true);
    setToast(`Deal closed — sold to ${buyer} for ฿${parseInt(price, 10).toLocaleString()}`);
  };

  return (
    <>
      <TopNav />
      <div style={{ opacity: 0.42, pointerEvents: 'none', userSelect: 'none' }}>
        <BackdropContent />
      </div>
      {!done && (
        <>
          <Overlay onClose={() => setDone(true)} />
          {flavor === 'from-chat'
            ? <FromChatModal onClose={() => setDone(true)} onConfirm={handleConfirm} onSwitchToPick={() => setFlavor('pick-buyer')} />
            : <PickBuyerModal onClose={() => setDone(true)} onConfirm={handleConfirm} />}
        </>
      )}
      {toast && <Toast message={toast} />}
    </>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
