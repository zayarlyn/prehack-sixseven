<script type="text/babel">
const { useState, useMemo, useRef, useEffect } = React;

/* ─── Logo ──────────────────────────────────────────────────── */
const Logo = ({ compact = false }) => (
  <div style={{ display: 'flex', alignItems: 'center', gap: 9 }}>
    <div style={{
      width: 34, height: 34, borderRadius: 9,
      background: '#fa4617',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: '0 2px 6px rgba(250,70,23,0.25)',
      flexShrink: 0,
    }}>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M4 8 L15 8 M12.5 5.5 L15 8 L12.5 10.5" stroke="#ffffff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
        <path d="M20 16 L9 16 M11.5 13.5 L9 16 L11.5 18.5" stroke="#ffffff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
    </div>
    {!compact && (
      <span style={{ fontSize: 17, fontWeight: 800, letterSpacing: -0.3, color: '#1a1a1a', whiteSpace: 'nowrap' }}>
        sw<span style={{ color: '#fa4617' }}>a</span>p
      </span>
    )}
  </div>
);

/* ─── Avatar ─────────────────────────────────────────────────── */
const Avatar = ({ name, size = 36 }) => {
  const initials = name.split(' ').map(s => s[0]).slice(0, 2).join('').toUpperCase();
  const hue = (name.charCodeAt(0) * 37) % 360;
  return (
    <div style={{
      width: size, height: size, borderRadius: '50%',
      background: `oklch(0.82 0.04 ${hue})`,
      color: '#1a1a1a',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontSize: size * 0.36, fontWeight: 700,
      flexShrink: 0,
      border: '1.5px solid #fff',
      boxShadow: '0 0 0 1px rgba(0,0,0,0.05)',
    }}>
      {initials}
    </div>
  );
};

/* ─── Icon button ─────────────────────────────────────────────── */
const IconButton = ({ children, badge }) => {
  const [hover, setHover] = useState(false);
  return (
    <button
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        position: 'relative',
        width: 40, height: 40, borderRadius: 999,
        background: hover ? '#f1f1f1' : 'transparent',
        border: 'none', cursor: 'pointer',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        color: 'var(--text)',
        transition: 'background 120ms ease',
      }}
    >
      {children}
      {badge > 0 && (
        <span style={{
          position: 'absolute', top: 4, right: 4,
          minWidth: 18, height: 18, padding: '0 5px',
          background: 'var(--primary)', color: '#fff',
          borderRadius: 999, fontSize: 11, fontWeight: 700,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          border: '2px solid #fff', lineHeight: 1,
        }}>
          {badge}
        </span>
      )}
    </button>
  );
};

/* ─── Sell button ─────────────────────────────────────────────── */
const SellButton = () => {
  const [hover, setHover] = useState(false);
  return (
    <button
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        height: 40, padding: '0 16px', borderRadius: 6,
        background: hover ? 'var(--primary-hover)' : 'var(--primary)',
        color: '#fff', border: 'none',
        fontSize: 14.5, fontWeight: 600, cursor: 'pointer',
        display: 'flex', alignItems: 'center', gap: 6,
        boxShadow: hover ? '0 4px 12px rgba(250,70,23,0.28)' : '0 1px 2px rgba(16,24,40,0.06)',
        transition: 'all 120ms ease',
      }}
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" />
      </svg>
      Sell
    </button>
  );
};

/* ─── Top Nav ─────────────────────────────────────────────────── */
const TopNavInline = ({ query, setQuery }) => {
  const [searchFocus, setSearchFocus] = useState(false);
  return (
    <header style={{
      position: 'sticky', top: 0, zIndex: 30,
      background: 'rgba(255,255,255,0.92)',
      backdropFilter: 'saturate(180%) blur(10px)',
      WebkitBackdropFilter: 'saturate(180%) blur(10px)',
      borderBottom: '1px solid var(--border)',
    }}>
      <div style={{
        maxWidth: 1440, margin: '0 auto',
        padding: '12px 20px',
        display: 'flex', alignItems: 'center', gap: 16,
      }}>
        <Logo />
        <div style={{
          flex: 1, maxWidth: 520, margin: '0 8px',
          display: 'flex', alignItems: 'center',
          background: searchFocus ? '#fff' : '#f1f1f1',
          border: `1.5px solid ${searchFocus ? 'var(--primary)' : 'transparent'}`,
          borderRadius: 999, padding: '0 14px', height: 42,
          transition: 'all 120ms ease',
          boxShadow: searchFocus ? '0 0 0 4px var(--primary-tint)' : 'none',
        }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style={{ color: 'var(--text-secondary)', flexShrink: 0 }}>
            <circle cx="11" cy="11" r="7" stroke="currentColor" strokeWidth="2" />
            <path d="M20 20l-3.5-3.5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" />
          </svg>
          <input
            value={query}
            onChange={e => setQuery(e.target.value)}
            onFocus={() => setSearchFocus(true)}
            onBlur={() => setSearchFocus(false)}
            placeholder="Search items..."
            style={{
              flex: 1, border: 'none', outline: 'none', background: 'transparent',
              fontSize: 14.5, color: 'var(--text)', padding: '0 10px', height: '100%',
            }}
          />
          {query && (
            <button onClick={() => setQuery('')}
              style={{ background: 'transparent', border: 'none', cursor: 'pointer', color: 'var(--text-secondary)', padding: 4, display: 'flex', alignItems: 'center' }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" strokeWidth="2" strokeLinecap="round" />
              </svg>
            </button>
          )}
        </div>
        <div style={{ flex: 1 }} />
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <IconButton badge={3}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M21 12a8 8 0 0 1-11.6 7.15L4 20l1-4.4A8 8 0 1 1 21 12Z" stroke="currentColor" strokeWidth="2" strokeLinejoin="round" />
            </svg>
          </IconButton>
          <Avatar name="Pim" />
          <SellButton />
        </div>
      </div>
    </header>
  );
};

/* ─── Chevron ─────────────────────────────────────────────────── */
const Chevron = ({ open }) => (
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
    style={{ transition: 'transform 120ms ease', transform: open ? 'rotate(180deg)' : 'none' }}>
    <path d="M6 9l6 6 6-6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
  </svg>
);

/* ─── Popover ─────────────────────────────────────────────────── */
const Popover = ({ open, onClose, children, align = 'right' }) => {
  const ref = useRef();
  useEffect(() => {
    if (!open) return;
    const handler = e => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div ref={ref} style={{
      position: 'absolute', top: 'calc(100% + 8px)', [align]: 0,
      background: '#fff', borderRadius: 10,
      boxShadow: 'var(--shadow-popover)', border: '1px solid var(--border)',
      padding: 16, zIndex: 40, minWidth: 240,
    }}>
      {children}
    </div>
  );
};

/* ─── Filter pill ─────────────────────────────────────────────── */
const FilterPill = ({ children, active, onClick }) => {
  const [hover, setHover] = useState(false);
  return (
    <button onClick={onClick} onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{
        height: 36, padding: '0 12px', borderRadius: 999,
        background: active ? 'var(--primary-tint)' : (hover ? '#f1f1f1' : '#fff'),
        color: active ? 'var(--primary)' : 'var(--text)',
        border: `1.5px solid ${active ? 'transparent' : 'var(--border)'}`,
        fontSize: 13.5, fontWeight: 500,
        display: 'flex', alignItems: 'center', gap: 6,
        cursor: 'pointer', whiteSpace: 'nowrap',
      }}
    >
      {children}
    </button>
  );
};

/* ─── NumInput ────────────────────────────────────────────────── */
const NumInput = ({ value, onChange, placeholder }) => (
  <div style={{ flex: 1, display: 'flex', alignItems: 'center', background: '#fff', border: '1.5px solid var(--border)', borderRadius: 6, padding: '0 10px', height: 38 }}>
    <span style={{ color: 'var(--text-tertiary)', fontSize: 13, marginRight: 4 }}>฿</span>
    <input type="number" placeholder={placeholder} value={value} onChange={e => onChange(e.target.value)}
      style={{ flex: 1, border: 'none', outline: 'none', fontSize: 14, background: 'transparent', minWidth: 0 }} />
  </div>
);

/* ─── Price filter ────────────────────────────────────────────── */
const PriceFilter = ({ value, onChange }) => {
  const [open, setOpen] = useState(false);
  const [min, setMin] = useState(value.min);
  const [max, setMax] = useState(value.max);
  const active = value.min != null || value.max != null;
  const label = !active ? 'Price' : `฿${value.min ?? 0}–${value.max != null ? value.max : '∞'}`;
  return (
    <div style={{ position: 'relative' }}>
      <FilterPill active={active} onClick={() => setOpen(o => !o)}>{label}<Chevron open={open} /></FilterPill>
      <Popover open={open} onClose={() => setOpen(false)}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12, minWidth: 240 }}>
          <span style={{ fontSize: 13, fontWeight: 600 }}>Price range</span>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
            <NumInput placeholder="Min" value={min ?? ''} onChange={v => setMin(v === '' ? null : Number(v))} />
            <span style={{ color: 'var(--text-secondary)' }}>–</span>
            <NumInput placeholder="Max" value={max ?? ''} onChange={v => setMax(v === '' ? null : Number(v))} />
          </div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
            {[[0,500],[500,1000],[1000,3000],[3000,null]].map(([lo, hi], i) => (
              <button key={i} onClick={() => { setMin(lo); setMax(hi); }}
                style={{ fontSize: 12.5, padding: '6px 10px', background: '#f7f7f7', border: '1px solid var(--border)', borderRadius: 999, cursor: 'pointer', color: 'var(--text)' }}>
                ฿{lo}{hi ? `–${hi}` : '+'}
              </button>
            ))}
          </div>
          <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
            <button onClick={() => { setMin(null); setMax(null); onChange({ min: null, max: null }); setOpen(false); }}
              style={{ flex: 1, height: 36, borderRadius: 6, background: 'transparent', border: '1px solid var(--border)', cursor: 'pointer', fontSize: 13, fontWeight: 500, color: 'var(--text)' }}>
              Clear
            </button>
            <button onClick={() => { onChange({ min, max }); setOpen(false); }}
              style={{ flex: 1, height: 36, borderRadius: 6, background: 'var(--primary)', color: '#fff', border: 'none', cursor: 'pointer', fontSize: 13, fontWeight: 600 }}>
              Apply
            </button>
          </div>
        </div>
      </Popover>
    </div>
  );
};

/* ─── Sort dropdown ───────────────────────────────────────────── */
const SORTS = [
  { id: 'newest', label: 'Newest' },
  { id: 'low', label: 'Price: low to high' },
  { id: 'high', label: 'Price: high to low' },
];

const SortDropdown = ({ value, onChange }) => {
  const [open, setOpen] = useState(false);
  const current = SORTS.find(s => s.id === value);
  return (
    <div style={{ position: 'relative' }}>
      <FilterPill active={false} onClick={() => setOpen(o => !o)}>
        <span style={{ color: 'var(--text-secondary)', marginRight: 4 }}>Sort:</span>
        {current.label}<Chevron open={open} />
      </FilterPill>
      <Popover open={open} onClose={() => setOpen(false)}>
        <div style={{ display: 'flex', flexDirection: 'column', minWidth: 200 }}>
          {SORTS.map(s => (
            <button key={s.id} onClick={() => { onChange(s.id); setOpen(false); }}
              style={{
                textAlign: 'left', padding: '10px 12px',
                background: s.id === value ? 'var(--primary-tint)' : 'transparent',
                color: s.id === value ? 'var(--primary)' : 'var(--text)',
                border: 'none', borderRadius: 6, cursor: 'pointer', fontSize: 14,
                fontWeight: s.id === value ? 600 : 500,
                display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              }}>
              {s.label}
              {s.id === value && (
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                  <path d="M5 12.5l4.5 4.5L19 7" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />

/* ─── App ─────────────────────────────────────────────────────── */
const PAGE_SIZE = 12;

const App = () => {
  const [query, setQuery] = useState('');
  const [category, setCategory] = useState('All');
  const [priceRange, setPriceRange] = useState({ min: null, max: null });
  const [sort, setSort] = useState('newest');
  const [shown, setShown] = useState(PAGE_SIZE);

  const filtered = useMemo(() => {
    let xs = ITEMS.slice();
    if (category !== 'All') xs = xs.filter(i => i.category === category);
    if (query.trim()) {
      const q = query.toLowerCase();
      xs = xs.filter(i => i.title.toLowerCase().includes(q) || i.seller.toLowerCase().includes(q));
    }
    if (priceRange.min != null) xs = xs.filter(i => i.price >= priceRange.min);
    if (priceRange.max != null) xs = xs.filter(i => i.price <= priceRange.max);
    if (sort === 'low') xs.sort((a, b) => a.price - b.price);
    else if (sort === 'high') xs.sort((a, b) => b.price - a.price);
    return xs;
  }, [category, query, priceRange, sort]);

  const visible = filtered.slice(0, shown);
  const remaining = filtered.length - visible.length;
  const isEmpty = filtered.length === 0;

  const clearFilters = () => { setCategory('All'); setQuery(''); setPriceRange({ min: null, max: null }); setSort('newest'); };

  useEffect(() => { setShown(PAGE_SIZE); }, [category, query, priceRange, sort]);

  return (
    <div>
      <TopNavInline query={query} setQuery={setQuery} />
      <FilterRow category={category} setCategory={setCategory} priceRange={priceRange} setPriceRange={setPriceRange} sort={sort} setSort={setSort} />

      <main style={{ maxWidth: 1440, margin: '0 auto', padding: '8px 20px 120px' }}>
        {!isEmpty && (
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, padding: '6px 2px 14px' }}>
            <span style={{ fontSize: 13.5, color: 'var(--text-secondary)' }}>
              <span style={{ color: 'var(--text)', fontWeight: 600 }}>{filtered.length}</span> {filtered.length === 1 ? 'item' : 'items'}
              {category !== 'All' && <> in <span style={{ color: 'var(--text)', fontWeight: 600 }}>{category}</span></>}
            </span>
          </div>
        )}

        {isEmpty ? (
          <EmptyState onClear={clearFilters} />
        ) : (
          <>
            <div className="feed-grid">
              {visible.map(item => <ItemCard key={item.id} item={item} />)}
            </div>
            {remaining > 0 && <LoadMore onClick={() => setShown(s => s + PAGE_SIZE)} remaining={remaining} />}
          </>
        )}
      </main>
    </div>
  );
};

window.App = App;
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
